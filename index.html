<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock-Paper-Scicors</h1>
    <div class="container"> 
        <h3>Please select</h3>
        <div class="choices">
        <select name="userchoice" id="userchoice" class="userchoice">
            <option value="rock">Rock</option>
            <option value="paper">Paper</option>
            <option value="scissors">Scissors</option>
        </select>
        <button id="play">Play</button>
        </div>
        <div class="result">
            <h3>Result</h3>
            <label for="input">Your choice: </label>
            <input type="text" id="input" readonly>
            <h3>VS</h3>
            <label for="com-input">Computer's choice: </label>
            <input type="text" id="com-input" readonly>
        </div>
        <h2 id="winner"></h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
